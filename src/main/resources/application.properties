spring.application.name=medappo

# Configuration de la base de données
spring.datasource.url=jdbc:postgresql://localhost:5432/medappo
spring.datasource.username=admin
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration du pool de connexions (performance)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Configuration JWT (clé secrète)
jwt.secret=maSuperCleSecretePourMedAppo2025Avec32CaracteresMin
jwt.expiration=3600000 # 1 heure en millisecondes

# Configuration des logs
logging.level.com.medappo=DEBUG
logging.level.org.springframework.security=INFO